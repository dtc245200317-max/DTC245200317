version: '3.8'

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: gym_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gym_management
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gym_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    networks:
      - backend

  web:
    build: .
    container_name: gym_web
    restart: always
    ports:
      - "8080:3000"
    depends_on:
      - db
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:latest
    container_name: gym_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend
    depends_on:
      - phpmyadmin

  prometheus:
    image: prom/prometheus:latest
    container_name: gym_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    user: "nobody"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: gym_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend
      - backend
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    container_name: gym_loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - backend

  promtail:
     image: grafana/promtail:latest
     container_name: gym_promtail
     restart: always
     volumes:
       - /var/log:/var/log
       - /var/lib/docker/containers:/var/lib/docker/containers:ro
       - ./promtail-config.yml:/etc/promtail/config.yml
     networks:
       - backend
